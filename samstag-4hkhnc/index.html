<style>
:root{--bg:#EDF0F1;--card:#fff;--fg:#13242C;--muted:#52646C;--line:#C9D3D7;--accent:#A8402F;--accent-fg:#fff}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:17px/1.5 'Source Sans 3','Segoe UI',system-ui,sans-serif;padding:16px}

label{display:block;font-weight:600;margin-bottom:6px}

button{margin-top:14px;font:inherit;font-weight:700;width:100%;padding:12px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
